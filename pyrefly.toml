project-includes = ["."]
project-excludes = [
    "tests",
    "scratch",
    ".venv",
    "venv",
]
search-path = ["."]
infer-with-first-use = false

[errors]
missing-attribute = "ignore"
bad-argument-type = "ignore"
bad-assignment = "ignore"
bad-override = "ignore"
unsupported-operation = "ignore"
read-only = "ignore"
incompatible-comparison = "ignore"
